services:
  vafa:
    build:
      context: .
      network: host
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      VAFA_CORS_ORIGINS: "${VAFA_CORS_ORIGINS:-}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
