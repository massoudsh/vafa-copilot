<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وفا | کوپایلوت هوشمند رشد و حفظ مشتری برای خرده‌فروشی</title>
<meta name="description" content="وفا به‌جای تخفیف کور، برای هر مشتری بهترین اقدام بعدی را پیشنهاد می‌دهد — چه کسی، چه زمانی، از چه کانالی، با چه پیشنهادی.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17221f;
    --muted:#5c6d68;
    --bg:#eef6f3;
    --card:rgba(255,255,255,.68);
    --accent:#0b8065;
    --accent-dark:#123d35;
    --accent-soft:#dff4eb;
    --gold:#c9973e;
    --border:rgba(255,255,255,.72);
    --line:rgba(19,61,53,.12);
    --shadow:0 24px 70px rgba(31,75,65,.13);
    --radius:24px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Vazirmatn', Tahoma, sans-serif;
    background:
      radial-gradient(circle at 12% 8%, rgba(166,232,211,.75), transparent 28rem),
      radial-gradient(circle at 90% 30%, rgba(248,220,155,.58), transparent 24rem),
      var(--bg);
    color:var(--ink);
    line-height:1.9;
    direction:rtl;
    min-height:100vh;
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.42),transparent 42%);z-index:-1;}
  .wrap{max-width:1160px;margin:0 auto;padding:0 24px;}
  header{position:sticky;top:0;background:rgba(242,249,246,.68);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border-bottom:1px solid var(--border);z-index:20;box-shadow:0 8px 24px rgba(37,81,71,.06);}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 0;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:var(--accent-dark);}
  .brand .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px rgba(11,128,101,.12);}
  .nav a.cta{background:rgba(11,128,101,.92);color:#fff;padding:10px 22px;border-radius:999px;font-weight:600;font-size:14px;text-decoration:none;box-shadow:0 8px 20px rgba(11,128,101,.18);}
  nav ul{list-style:none;display:flex;gap:28px;font-size:14px;color:var(--muted);}
  nav ul a{color:var(--muted);text-decoration:none;}
  nav ul a:hover,nav ul a:focus-visible{color:var(--accent-dark);}
  .navlinks{display:flex;align-items:center;gap:28px;}
  :focus-visible{outline:3px solid rgba(11,128,101,.45);outline-offset:4px;}

  .hero{padding:88px 0 64px;}
  .kicker{display:inline-flex;align-items:center;gap:8px;background:rgba(223,244,235,.78);color:var(--accent-dark);padding:6px 16px;border:1px solid rgba(255,255,255,.75);border-radius:999px;font-size:13px;font-weight:600;margin-bottom:24px;box-shadow:0 10px 28px rgba(43,105,87,.08);}
  h1{font-size:44px;font-weight:800;line-height:1.5;color:var(--accent-dark);max-width:820px;letter-spacing:-.02em;}
  h1 span{color:var(--accent);}
  .lead{font-size:18px;color:var(--muted);max-width:680px;margin-top:20px;}
  .hero-actions{display:flex;gap:14px;margin-top:36px;flex-wrap:wrap;}
  .btn-primary{background:var(--accent);color:#fff;padding:14px 30px;border-radius:14px;font-weight:700;text-decoration:none;font-size:15px;box-shadow:0 12px 25px -7px rgba(11,128,101,.46);}
  .btn-secondary{background:rgba(255,255,255,.5);color:var(--accent-dark);padding:14px 30px;border-radius:14px;font-weight:700;text-decoration:none;font-size:15px;border:1px solid var(--border);box-shadow:0 8px 25px rgba(42,88,76,.06);}
  .btn-primary:hover,.btn-secondary:hover,.nav a.cta:hover{transform:translateY(-1px);}
  .persona-strip{display:flex;gap:14px;flex-wrap:wrap;margin-top:56px;}
  .chip{background:rgba(255,255,255,.58);border:1px solid var(--border);border-radius:999px;padding:10px 18px;font-size:13.5px;color:var(--muted);box-shadow:0 8px 22px rgba(42,88,76,.06);}
  .chip b{color:var(--ink);font-weight:600;}

  section{padding:72px 0;}
  .section-head{max-width:640px;margin-bottom:44px;}
  .section-kicker{color:var(--accent);font-weight:700;font-size:13px;letter-spacing:.02em;margin-bottom:10px;}
  h2{font-size:30px;font-weight:800;color:var(--accent-dark);}
  .section-head p{color:var(--muted);margin-top:12px;font-size:15.5px;}

  .problem-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  .problem-card,.feature-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow);backdrop-filter:blur(18px) saturate(135%);-webkit-backdrop-filter:blur(18px) saturate(135%);}
  .problem-card .num{font-size:13px;color:var(--gold);font-weight:700;margin-bottom:12px;}
  .problem-card h3{font-size:17px;font-weight:700;margin-bottom:8px;}
  .problem-card p{color:var(--muted);font-size:14px;}
  .flow{background:linear-gradient(145deg,rgba(18,61,53,.96),rgba(9,103,81,.91));border:1px solid rgba(255,255,255,.2);border-radius:28px;padding:48px 40px;color:#fff;box-shadow:var(--shadow);}
  .flow h2{color:#fff;}
  .flow .section-head p{color:#D3E4DD;}
  .flow-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:20px;}
  .flow-step{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:20px;backdrop-filter:blur(12px);}
  .flow-step .stepnum{width:32px;height:32px;border-radius:50%;background:var(--gold);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;margin-bottom:14px;}
  .flow-step h4{font-size:15px;font-weight:700;margin-bottom:6px;}
  .flow-step p{font-size:13px;color:#D3E4DD;}
  .features{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  .feature-icon{width:44px;height:44px;border-radius:14px;background:rgba(223,244,235,.8);display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:16px;}
  .feature-card h3{font-size:16px;font-weight:700;margin-bottom:8px;}
  .feature-card p{color:var(--muted);font-size:14px;}

  .workspace{background:rgba(255,255,255,.48);border:1px solid var(--border);border-radius:30px;padding:20px;box-shadow:var(--shadow);backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%);}
  .workspace-top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;}
  .workspace-title{display:flex;align-items:center;gap:12px;}
  .workspace-title strong{font-size:18px;color:var(--accent-dark);}
  .status-dot{width:10px;height:10px;border-radius:50%;background:#25a875;box-shadow:0 0 0 5px rgba(37,168,117,.12);}
  .workspace-meta{font-size:12px;color:var(--muted);}
  .dashboard-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;}
  .panel{background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.8);border-radius:22px;padding:20px;box-shadow:0 12px 34px rgba(38,80,70,.07);}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;}
  .panel h3{font-size:15px;color:var(--accent-dark);}
  .filter-group{display:flex;gap:8px;flex-wrap:wrap;}
  .filter{border:1px solid var(--line);background:rgba(255,255,255,.56);border-radius:999px;padding:7px 12px;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;}
  .filter[aria-pressed="true"],.filter:hover{background:var(--accent);border-color:var(--accent);color:#fff;}
  .action-list{display:grid;gap:10px;}
  .action-row{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:11px;text-align:right;width:100%;border:1px solid transparent;background:rgba(246,251,249,.72);border-radius:16px;padding:12px;cursor:pointer;color:var(--ink);font:inherit;}
  .action-row:hover,.action-row[aria-selected="true"]{border-color:rgba(11,128,101,.28);background:#fff;}
  .priority{width:8px;height:34px;border-radius:8px;background:#9db8ae;}
  .priority.high{background:#e07a64;}.priority.medium{background:#d4a447;}
  .action-row strong{display:block;font-size:13px;}.action-row small{display:block;color:var(--muted);font-size:11px;}
  .action-badge{background:var(--accent-soft);color:var(--accent-dark);padding:4px 8px;border-radius:999px;font-size:10px;white-space:nowrap;}
  .detail-card{min-height:224px;display:flex;flex-direction:column;justify-content:space-between;}
  .detail-label{font-size:11px;color:var(--accent);font-weight:700;}.detail-card h3{font-size:22px;margin-top:4px;}.detail-card p{color:var(--muted);font-size:13px;margin-top:9px;}
  .detail-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:14px;margin-top:18px;font-size:12px;color:var(--muted);}
  .detail-footer b{color:var(--accent-dark);}
  .empty-state{color:var(--muted);font-size:13px;padding:20px;text-align:center;}
  .campaign-composer{display:grid;gap:8px;margin-top:14px;}
  .campaign-composer textarea{width:100%;min-height:76px;resize:vertical;border:1px solid var(--line);border-radius:14px;padding:11px;font:inherit;font-size:13px;color:var(--ink);background:rgba(255,255,255,.78);}
  .campaign-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .campaign-actions button{border:1px solid var(--line);border-radius:12px;padding:8px 13px;background:rgba(255,255,255,.72);color:var(--accent-dark);font:inherit;font-size:12px;font-weight:600;cursor:pointer;}
  .campaign-actions .approve{background:var(--accent);border-color:var(--accent);color:#fff;}
  .campaign-actions .reject{color:#98533f;}
  .campaign-status{margin-top:8px;font-size:12px;color:var(--muted);min-height:1.4em;}
  .campaign-count{font-size:12px;color:var(--muted);}
  @media (prefers-reduced-transparency: reduce){header,.workspace,.panel,.problem-card,.feature-card{backdrop-filter:none;-webkit-backdrop-filter:none;background:#f8fcfa;}}
  @media (prefers-reduced-motion: reduce){html{scroll-behavior:auto;}.btn-primary,.btn-secondary,.nav a.cta{transition:none;}}
  .demo{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:0;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;}
  .demo-left{padding:44px;}
  .demo-left .section-kicker{margin-bottom:10px;}
  .demo-left h2{font-size:26px;}
  .demo-left p{color:var(--muted);margin-top:12px;font-size:14.5px;}
  .demo-right{background:#10211e;padding:32px;color:#E8EAE6;font-family:'SFMono-Regular',Consolas,monospace;font-size:12.5px;overflow-x:auto;direction:ltr;text-align:left;}
  .demo-right pre{white-space:pre-wrap;line-height:1.8;}
  .tag-high{color:#ff9b86;}.tag-med{color:#ffd180;}.tag-low{color:#a5d6a7;}

  .cta-band{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-dark) 100%);border-radius:28px;padding:56px 44px;color:#fff;text-align:center;box-shadow:var(--shadow);}
  .cta-band h2{color:#fff;font-size:28px;}
  .cta-band p{color:#DCEBE3;margin-top:12px;max-width:520px;margin-inline:auto;}
  .cta-band .hero-actions{justify-content:center;margin-top:28px;}
  .cta-band .btn-primary{background:#fff;color:var(--accent-dark);box-shadow:none;}
  .cta-band .btn-secondary{color:#fff;border-color:rgba(255,255,255,0.35);background:transparent;}

  footer{border-top:1px solid var(--line);padding:32px 0;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;}


  @media (max-width:860px){
    h1{font-size:32px;}
    .problem-grid,.features{grid-template-columns:1fr;}
    .flow-steps{grid-template-columns:1fr 1fr;}
    .dashboard-grid{grid-template-columns:1fr;}
    .demo{grid-template-columns:1fr;}
    nav ul{display:none;}
  }
  @media (max-width:560px){.workspace-top{align-items:flex-start;flex-direction:column;}.workspace{padding:14px;}.panel{padding:15px;}.flow{padding:32px 22px;}.flow-steps{grid-template-columns:1fr;}}
  .metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}.metric{background:rgba(255,255,255,.64);border:1px solid rgba(255,255,255,.82);border-radius:16px;padding:12px;}.metric strong{display:block;color:var(--accent-dark);font-size:20px;}.metric span{color:var(--muted);font-size:11px;} .metric-grid + .dashboard-grid{margin-top:0;}
  @media (max-width:560px){.metric-grid{grid-template-columns:repeat(2,1fr);}}

</head>
<body>

<header>
  <div class="wrap nav">
    <div class="brand"><span class="dot"></span> وفا</div>
    <div class="navlinks">
      <ul>
        <li><a href="#problem">مسئله</a></li>
        <li><a href="#how">نحوه‌ی کار</a></li>
        <li><a href="#features">امکانات</a></li>
        <li><a href="#workspace">داشبورد نمونه</a></li>
        <li><a href="#demo">نمونه‌ی تصمیم</a></li>
      </ul>
      <a class="cta" href="#waitlist">ثبت‌نام لیست انتظار</a>
    </div>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <span class="kicker">🌿 کوپایلوت رشد و حفظ مشتری برای خرده‌فروشی ایران</span>
    <h1>برای هر مشتری، <span>بهترین اقدام بعدی</span> را همین امروز پیدا کن — نه یک تخفیف برای همه</h1>
    <p class="lead">وفا داده‌ی خرید، سبد، و مکالمات اینستاگرام و واتساپت را می‌خواند و برای هر مشتری مشخص می‌کند با چه کانالی، چه زمانی و با چه پیشنهادی تماس بگیری — یادآوری، ارسال رایگان، کش‌بک، اقساط یا هیچ‌کدام.</p>
    <div class="hero-actions">
      <a class="btn-primary" href="#waitlist">درخواست دسترسی زودهنگام</a>
      <a class="btn-secondary" href="#demo">دیدن نمونه‌ی تصمیم</a>
    </div>
    <div class="persona-strip">
      <div class="chip"><b>سارا</b> فقط یادآوری می‌خواهد</div>
      <div class="chip"><b>علی</b> به ارسال رایگان حساس است</div>
      <div class="chip"><b>مریم</b> بدون تخفیف هم می‌خرد</div>
      <div class="chip"><b>حسین</b> به اقساط نیاز دارد</div>
      <div class="chip"><b>زهرا</b> را نباید زیاد پیام داد</div>
    </div>
  </div>
</section>

<section id="problem">
  <div class="wrap">
    <div class="section-head">
      <div class="section-kicker">مسئله</div>
      <h2>خرده‌فروش‌ها مشتری کم ندارند — تصمیم درست درباره‌ی مشتری کم دارند</h2>
      <p>داده‌ی مشتری، خرید، مکالمه و سبد هست؛ اما کسی نیست که از دلش تصمیم بسازد. نتیجه یک حلقه‌ی معیوب است: داده‌ی بیشتر، کمپین بیشتر، تخفیف بیشتر، margin کمتر، وفاداری کمتر.</p>
    </div>
    <div class="problem-grid">
      <div class="problem-card">
        <div class="num">۰۱</div>
        <h3>تخفیف کور برای همه</h3>
        <p>یک کد تخفیف عمومی برای مشتری‌ای که بدون تخفیف هم می‌خرید، یعنی سوزاندن margin بی‌دلیل.</p>
      </div>
      <div class="problem-card">
        <div class="num">۰۲</div>
        <h3>پیگیری دستی و فراموش‌شده</h3>
        <p>سبدهای رهاشده، پرسش‌های دایرکت و مشتری‌های در آستانه‌ی ریزش بدون پاسخ به‌موقع می‌مانند.</p>
      </div>
      <div class="problem-card">
        <div class="num">۰۳</div>
        <h3>پیام زیاد به مشتری اشتباه</h3>
        <p>بمباران پیامکی مشتری‌ای که تازه خرید کرده، هم مزاحم است هم اعتماد را از بین می‌برد.</p>
      </div>
    </div>
  </div>
</section>

<section id="how">
  <div class="wrap flow">
    <div class="section-head">
      <div class="section-kicker" style="color:#F0D9A0;">نحوه‌ی کار</div>
      <h2>از داده‌ی پراکنده تا یک تصمیم قابل‌اعتماد</h2>
      <p>هر تصمیم با دلیل روشن همراه است — نه جعبه‌سیاه؛ چیزی که فروشنده‌ی ایرانی بتواند به آن اعتماد کند.</p>
    </div>
    <div class="flow-steps">
      <div class="flow-step">
        <div class="stepnum">۱</div>
        <h4>خواندن سیگنال</h4>
        <p>خرید، سبد رهاشده، مکالمه‌ی دایرکت/واتساپ، زمان‌بندی خرید</p>
      </div>
      <div class="flow-step">
        <div class="stepnum">۲</div>
        <h4>تحلیل وضعیت مشتری</h4>
        <p>ریسک ریزش، حساسیت به قیمت/ارسال، نیاز به اقساط، خستگی از پیام</p>
      </div>
      <div class="flow-step">
        <div class="stepnum">۳</div>
        <h4>انتخاب بهترین اقدام</h4>
        <p>یادآوری، ارسال رایگان، کش‌بک، BNPL، دسترسی زودهنگام یا سکوت</p>
      </div>
      <div class="flow-step">
        <div class="stepnum">۴</div>
        <h4>پیام آماده‌ی ارسال</h4>
        <p>متن فارسی طبیعی، متناسب با لحن همان کانال</p>
      </div>
    </div>
  </div>
</section>

<section id="features">
  <div class="wrap">
    <div class="section-head">
      <div class="section-kicker">امکانات</div>
      <h2>یک لایه‌ی تصمیم روی داده‌هایی که همین حالا داری</h2>
    </div>
    <div class="features">
      <div class="feature-card">
        <div class="feature-icon">🧭</div>
        <h3>بهترین اقدام بعدی، قابل توضیح</h3>
        <p>هر پیشنهاد با دلیل روشن می‌آید تا بتوانی رد یا تأیید کنی — نه یک عدد رمزآلود.</p>
      </div>
      <div class="feature-card">
        <div class="feature-icon">💬</div>
        <h3>فهم مکالمه‌ی فارسی محاوره‌ای</h3>
        <p>پرسش قیمت، ارسال، پرداخت قسطی یا شکایت را از دل دایرکت و واتساپ تشخیص می‌دهد.</p>
      </div>
      <div class="feature-card">
        <div class="feature-icon">🎯</div>
        <h3>پیشنهاد متناسب، نه تخفیف پیش‌فرض</h3>
        <p>انتخاب بین یادآوری، ارسال رایگان، کش‌بک، bundle یا BNPL بر اساس رفتار واقعی مشتری.</p>
      </div>
      <div class="feature-card">
        <div class="feature-icon">🔕</div>
        <h3>احترام به آستانه‌ی پیام</h3>
        <p>مشتری‌هایی که نباید زیاد پیام بگیرند، به‌طور خودکار از کمپین بعدی کنار گذاشته می‌شوند.</p>
      </div>
      <div class="feature-card">
        <div class="feature-icon">📲</div>
        <h3>کانال درست، زمان درست</h3>
        <p>اینستاگرام، واتساپ یا پیامک — بر اساس ترجیح واقعی هر مشتری، نه یک کانال ثابت برای همه.</p>
      </div>
      <div class="feature-card">
        <div class="feature-icon">📈</div>
        <h3>یادگیری از هر کمپین</h3>
        <p>نتیجه‌ی هر ارسال به موتور تصمیم بازمی‌گردد تا پیشنهاد بعدی دقیق‌تر شود.</p>
      </div>
    </div>
  </div>
</section>

<section id="workspace">
  <div class="wrap">
    <div class="section-head">
      <div class="section-kicker">داشبورد نمونه</div>
      <h2>از پیشنهاد تا اقدام، در یک نگاه</h2>
      <p>این محیط تعاملی با داده‌ی ساختگی کار می‌کند؛ فیلتر کن، یک مشتری را انتخاب کن، متن پیام را ویرایش کن و پیش‌نویس کمپین را تأیید یا رد کن. هیچ پیامی واقعاً ارسال نمی‌شود.</p>
    </div>
    <div class="workspace" aria-label="داشبورد نمونه‌ی وفا">
      <div class="workspace-top">
        <div class="workspace-title"><span class="status-dot" aria-hidden="true"></span><strong>مرکز تصمیم وفا</strong></div>
        <span class="workspace-meta" id="data-source">داده‌ی نمونه‌ی محلی · در حال بررسی اتصال به API</span>
      </div>
      <div class="metric-grid" aria-label="خلاصه‌ی داشبورد">
        <div class="metric"><strong id="metric-total">۰</strong><span>کل پیشنهادها</span></div>
        <div class="metric"><strong id="metric-high">۰</strong><span>فوری</span></div>
        <div class="metric"><strong id="metric-actionable">۰</strong><span>قابل اقدام</span></div>
        <div class="metric"><strong id="metric-channels">۰</strong><span>کانال فعال</span></div>
      </div>
      <div class="dashboard-grid">
        <div class="panel">
          <div class="panel-head">
            <h3>اقدام‌های اولویت‌دار</h3>
            <div class="filter-group" aria-label="فیلتر اقدام">
              <button class="filter" type="button" data-filter="all" aria-pressed="true">همه</button>
              <button class="filter" type="button" data-filter="high" aria-pressed="false">فوری</button>
              <button class="filter" type="button" data-filter="care" aria-pressed="false">رسیدگی</button>
              <button class="filter" type="button" data-filter="instagram" aria-pressed="false">اینستاگرام</button>
            </div>
          </div>
          <div class="action-list" id="action-list" aria-live="polite"></div>
        </div>
        <article class="panel detail-card" id="action-detail" aria-live="polite">
          <div>
            <span class="detail-label">اقدام پیشنهادی</span>
            <h3>یک مشتری را انتخاب کنید</h3>
            <p>از فهرست سمت راست یک ردیف را انتخاب کنید تا کانال، اولویت و دلیل تصمیم را ببینید.</p>
          </div>
          <div>
            <div class="campaign-composer">
              <label for="campaign-message" style="font-size:12px;color:var(--muted);">پیش‌نمایش پیام</label>
              <textarea id="campaign-message" aria-describedby="campaign-status"></textarea>
            </div>
            <div class="campaign-actions">
              <button class="approve" type="button" data-campaign="approve">تأیید کمپین</button>
              <button type="button" data-campaign="schedule">زمان‌بندی</button>
              <button class="reject" type="button" data-campaign="reject">رد پیشنهاد</button>
            </div>
            <div class="campaign-status" id="campaign-status" role="status"></div>
          </div>
          <div class="detail-footer"><span>کانال</span><b>در انتظار انتخاب</b></div>
        </article>
      </div>
    </div>
  </div>
</section>

  <div class="wrap">
    <div class="demo">
      <div class="demo-left">
        <div class="section-kicker">نمونه‌ی خروجی موتور</div>

        <p>مشتری سبدش را با پرسش «قسطی می‌شه؟» رها کرده. به‌جای تخفیف عمومی، وفا پیشنهاد اقساط را با دلیل مشخص برمی‌گرداند — آماده برای ارسال در همان کانال.</p>
      </div>
      <div class="demo-right">
<pre>{
  "customer": "سارا احمدی",

<section id="waitlist">
  <div class="wrap">
    <div class="cta-band">
      <h2>خرده‌فروش یا social commerce داری؟</h2>
      <p>وفا را روی کانال‌های فروش موجودت (اینستاگرام، واتساپ، فروشگاه‌ساز) بدون تغییر ابزار فعلی وصل می‌کنیم.</p>
      <div class="hero-actions">
        <a class="btn-primary" href="mailto:hello@vafa.ai">درخواست دسترسی زودهنگام</a>
        <a class="btn-secondary" href="#how">بیشتر بدان</a>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap" style="display:flex;justify-content:space-between;width:100%;flex-wrap:wrap;gap:12px;">
    <span>© وفا — کوپایلوت رشد و حفظ مشتری برای خرده‌فروشی ایران</span>
    <span>ساخته‌شده برای social commerce و آنلاین‌شاپ‌های ایرانی</span>
  </div>
</footer>

<script>
  const actionLabels = {care:'رسیدگی', reminder:'یادآوری', free_shipping:'ارسال رایگان', cashback:'کش‌بک', bnpl:'پیشنهاد اقساط', discount_timeboxed:'تخفیف کوتاه‌مدت', loyalty_no_discount:'دسترسی زودهنگام', monitor:'پایش', suppress:'عدم ارسال'};
  const channelLabels = {instagram_dm:'اینستاگرام', whatsapp:'واتساپ', sms:'پیامک', none:'بدون کانال'};
  const toDashboardItem = action => ({
    id: action.customer_id,
    name: action.name,
    type: action.action_type,
    action: actionLabels[action.action_type] || action.action_type,
    priority: action.urgency,
    channelType: action.channel,
    channel: channelLabels[action.channel] || action.channel,
    reason: action.reason_fa,
    message: action.message_fa
  });
  const mockActions = [
    {id:'C001', name:'سارا احمدی', action:'پیشنهاد اقساط', type:'bnpl', priority:'high', channel:'اینستاگرام', channelType:'instagram', reason:'سبد رهاشده و سابقه‌ی پرسش از پرداخت قسطی.', message:'سلام سارا عزیز، می‌تونید «کیف چرم مدل آوا» رو الان بردارید و پرداختش رو در چند قسط انجام بدید.'},
    {id:'C008', name:'رضا کاظمی', action:'پیگیری رضایت', type:'care', priority:'high', channel:'واتساپ', channelType:'whatsapp', reason:'شکایت اخیر نیاز به رسیدگی انسانی دارد.', message:'سلام رضا عزیز 🌿 می‌خواستیم مطمئن بشیم تجربه‌ی خریدتون خوب بوده. اگه مشکلی هست همین‌جا بگید تا سریع رسیدگی کنیم.'},
    {id:'C005', name:'زهرا محمدی', action:'ارسال رایگان', type:'free_shipping', priority:'medium', channel:'اینستاگرام', channelType:'instagram', reason:'پرسش اخیر درباره‌ی هزینه‌ی ارسال.', message:'سلام زهرا عزیز، «عینک آفتابی کلاسیک» توی سبدتونه — امروز ارسالش رایگانه، از دست ندید.'},
    {id:'C012', name:'کیانوش رستمی', action:'یادآوری ملایم', type:'reminder', priority:'low', channel:'واتساپ', channelType:'whatsapp', reason:'کمی از چرخه‌ی معمول خرید فاصله گرفته است.', message:'سلام کیانوش جان، کالکشن جدیدتون هنوز منتظرتونه. هر وقت راحت بودید سر بزنید.'}
  ];
  const actionList = document.querySelector('#action-list');
  const detail = document.querySelector('#action-detail');
  const filters = document.querySelectorAll('.filter');
  const dataSource = document.querySelector('#data-source');
  let actions = mockActions;
  const renderActions = (filter = 'all') => {
    const visible = actions.filter(item => filter === 'all' || item.priority === filter || item.type === filter || item.channelType === filter);
    document.querySelector('#metric-total').textContent = visible.length.toLocaleString('fa-IR');
    document.querySelector('#metric-high').textContent = visible.filter(item => item.priority === 'high').length.toLocaleString('fa-IR');
    document.querySelector('#metric-actionable').textContent = visible.filter(item => item.type !== 'monitor').length.toLocaleString('fa-IR');
    document.querySelector('#metric-channels').textContent = new Set(visible.map(item => item.channelType)).size.toLocaleString('fa-IR');
    actionList.replaceChildren();
    if (!visible.length) {
      const empty = document.createElement('p');
      empty.className = 'empty-state';
      empty.textContent = 'موردی با این فیلتر پیدا نشد.';
      actionList.append(empty);
      return;
    }
    visible.forEach((item, index) => {
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'action-row';
      row.setAttribute('aria-selected', index === 0 ? 'true' : 'false');
      row.innerHTML = `<span class="priority ${item.priority}" aria-hidden="true"></span><span><strong>${item.name}</strong><small>${item.id} · ${item.channel}</small></span><span class="action-badge">${item.action}</span>`;
      row.addEventListener('click', () => {
        document.querySelectorAll('.action-row').forEach(button => button.setAttribute('aria-selected', 'false'));
        row.setAttribute('aria-selected', 'true');
        showDetail(item);
      });
      actionList.append(row);
      if (index === 0) showDetail(item);
    });
  };
  let selectedAction = null;
  const messageBox = document.querySelector('#campaign-message');
  const campaignStatus = document.querySelector('#campaign-status');
  const showDetail = item => {
    selectedAction = item;
    detail.querySelector('.detail-label').textContent = item.action;
    detail.querySelector('h3').textContent = item.name;
    detail.querySelector('p').textContent = item.reason;
    detail.querySelector('.detail-footer b').textContent = `${item.channel} · ${item.priority === 'high' ? 'فوری' : item.priority === 'medium' ? 'متوسط' : 'کم'}`;
    messageBox.value = item.message;
    campaignStatus.textContent = 'پیش‌نویس آماده‌ی بررسی است؛ ارسال واقعی انجام نمی‌شود.';
  };
  document.querySelectorAll('[data-campaign]').forEach(button => button.addEventListener('click', () => {
    if (!selectedAction) return;
    const text = messageBox.value.trim();
    if (button.dataset.campaign === 'reject') {
      campaignStatus.textContent = `پیشنهاد ${selectedAction.name} رد شد و در گزارش ثبت می‌شود.`;
      return;
    }
    if (!text) {
      campaignStatus.textContent = 'متن پیام نمی‌تواند خالی باشد.';
      messageBox.focus();
      return;
    }
    campaignStatus.textContent = button.dataset.campaign === 'approve'
      ? `کمپین ${selectedAction.name} تأیید شد (نمایشی؛ پیامی ارسال نمی‌شود).`
      : `کمپین ${selectedAction.name} برای بازبینی زمان‌بندی در صف قرار گرفت (نمایشی).`;
  }));
  filters.forEach(filter => filter.addEventListener('click', () => {
    filters.forEach(button => button.setAttribute('aria-pressed', 'false'));
    filter.setAttribute('aria-pressed', 'true');
    renderActions(filter.dataset.filter);
  }));
  renderActions();

  const loadLiveActions = async () => {
    // Same-origin path only exists when the FastAPI app serves this page at /dashboard.
    const response = await fetch('/next-best-action', {headers: {Accept: 'application/json'}});
    if (!response.ok) throw new Error(`status ${response.status}`);
    const payload = await response.json();
    if (!Array.isArray(payload) || !payload.length) throw new Error('empty payload');
    actions = payload.map(toDashboardItem);
    dataSource.textContent = `داده‌ی زنده از API · ${actions.length.toLocaleString('fa-IR')} مشتری`;
    renderActions(document.querySelector('.filter[aria-pressed="true"]').dataset.filter);
  };
  loadLiveActions().catch(() => {
    dataSource.textContent = 'داده‌ی نمونه‌ی محلی · API در دسترس نیست';
  });
</script>
</body>
</html>
